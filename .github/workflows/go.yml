name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Validate router configs
        run: |
          uv run scripts/validate_config.py example_router_valid.yaml
          uv run scripts/validate_config.py scripts/test_valid.yaml
          ! uv run scripts/validate_config.py example_router_fixed.yaml

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
